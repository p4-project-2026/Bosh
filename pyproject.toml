[project]
name = "Bosh"
version = "1.0.0"
description = "Bosh (Beginner‑Oriented SHell) is a scripting language built with an emphasis on readability and accessibility for casual programmers. Bosh introduces an English‑Like Language syntax that allows users to express file automation using natural English sentences and intuitive verbs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3.1",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "auto-py-to-exe>=2.50.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
addopts = "--tb=no -vv"

[project.scripts]
bosh = "bosh.app.bosh:main"
bosh_no_try = "bosh.app.bosh:main_no_try"
build = "scripts.build:build"
exe = "scripts.build_exe:build_exe"
